$kind: http-request
name: List Tasks
method: GET
url: '{{base_url}}/api/task/lists/:project'
order: 1000
auth:
  type: noauth
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: project
    value: '1'
    description: Project ID
