$kind: http-request
name: Destroy Project
method: DELETE
url: '{{base_url}}/api/project/destroy/:project'
order: 6000
auth:
  type: noauth
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: project
    value: '1'
    description: Project ID
