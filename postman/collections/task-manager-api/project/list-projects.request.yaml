$kind: http-request
name: List Projects
method: GET
url: '{{base_url}}/api/project/list'
order: 1000
auth:
  type: noauth
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Accept
    value: application/json
queryParams:
  - key: per_page
    value: '10'
    description: Number of results per page
