$kind: http-request
name: Show Project
method: GET
url: '{{base_url}}/api/project/show/:project'
order: 3000
auth:
  type: noauth
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: project
    value: '1'
    description: Project ID
