$kind: http-request
name: Refresh Token
method: POST
url: '{{base_url}}/api/auth/refresh'
order: 5000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.access_token) {
          pm.environment.set('token', json.data.access_token);
      }
