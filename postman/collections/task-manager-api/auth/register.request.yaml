$kind: http-request
name: Register
method: POST
url: '{{base_url}}/api/auth/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "email": "john@example.com",
      "password": "Password@123",
      "password_confirmation": "Password@123"
    }
