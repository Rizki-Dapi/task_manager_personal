$kind: http-request
name: Reset Password
method: POST
url: '{{base_url}}/api/auth/reset-password'
order: 9000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "token": "your-reset-token",
      "password": "NewPassword@123",
      "password_confirmation": "NewPassword@123"
    }
